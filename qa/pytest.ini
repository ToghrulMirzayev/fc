[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# CLI arguments
addopts = 
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html

# Custom markers
markers =
    smoke: Quick smoke tests verifying core functionality
    regression: Full regression test suite
    auth: Authentication tests
    members: Member-related workflow tests
    dashboard: Dashboard analytics and card verification tests

# Logging settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
