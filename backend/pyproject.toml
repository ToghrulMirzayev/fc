[project]
name = "fitnesscourt-backend"
version = "0.1.0"
description = "Fitness Court backend — FastAPI app, Telegram bot, Celery workers"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",

    # DB
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Auth / security
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "python-jose[cryptography]>=3.3.0",

    # Cache / queue
    "redis>=5.2.0",
    "celery>=5.4.0",

    # Telegram bot
    "aiogram>=3.13.0",

    # QR
    "qrcode[pil]>=8.0",

    # Email
    "resend>=2.4.0",

    # Logging / errors
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.18.0",

    # PDF (invoices)
    "weasyprint>=63.0",

    # Utils
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-redis",
    "asgi-lifespan>=2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RUF", "S"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
